<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — VNF 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Poppins',sans-serif;
      background: linear-gradient(135deg,#7B1F2E 0%,#C8792A 100%);
      min-height:100vh;
      display:flex; align-items:center; justify-content:center;
    }
    .card {
      background:white; border-radius:16px;
      padding:40px 36px; max-width:400px; width:100%;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
      margin:20px;
    }
    .lock { font-size:48px; text-align:center; margin-bottom:16px; }
    h1 { font-size:22px; text-align:center; color:#7B1F2E; margin-bottom:6px; }
    .sub { text-align:center; color:#999; font-size:13px; margin-bottom:28px; }
    label { display:block; font-size:13px; font-weight:600; color:#333; margin-bottom:8px; }
    input[type=password] {
      width:100%; border:2px solid #DDD; border-radius:8px;
      padding:12px 14px; font-size:15px; outline:none;
      font-family:'Poppins',sans-serif;
      transition:border-color 0.2s;
    }
    input[type=password]:focus { border-color:#7B1F2E; }
    .error-msg {
      background:#FFEBEE; color:#C62828;
      border:1px solid #FFCDD2; border-left:4px solid #C62828;
      border-radius:8px; padding:10px 14px;
      font-size:13px; margin-top:14px;
    }
    .btn {
      width:100%; margin-top:20px;
      background:linear-gradient(135deg,#7B1F2E,#9B2D3C);
      color:white; border:none; border-radius:8px;
      padding:14px; font-size:15px; font-weight:700;
      cursor:pointer; font-family:'Poppins',sans-serif;
      transition:transform 0.15s, box-shadow 0.15s;
      box-shadow:0 4px 14px rgba(123,31,46,0.3);
    }
    .btn:hover { transform:translateY(-2px); }
    .back { display:block; text-align:center; margin-top:16px; font-size:13px; color:#999; text-decoration:none; }
    .back:hover { color:#7B1F2E; }
  </style>
</head>
<body>
<div class="card">
  <div class="lock">🔐</div>
  <h1>Admin Panel</h1>
  <p class="sub">VNF Mahila Adhiveshan 2026 · Data Viewer</p>

  <form method="POST">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter admin password" autofocus required/>
    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}
    <button type="submit" class="btn">🔓 Login to Admin Panel</button>
  </form>

  <a href="/" class="back">← Back to Registration Form</a>
</div>
</body>
</html>
